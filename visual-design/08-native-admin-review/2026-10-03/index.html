<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雅睿英语 原生管理工作区候选稿</title>
<style>
:root{--navy:#102c64;--blue:#2587f4;--soft:#e7f3ff;--green:#19b66b;--orange:#ff8b43;--red:#ee5b58;--purple:#8b6cf4}
*{box-sizing:border-box}html,body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--navy)}
body{background:#eaf7ff url(../../../workspace/miniprogram/assets/g0/student-public-natural-background-v1.jpg) center top/100vw auto no-repeat}
.phone{position:relative;width:100%;height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(216,244,255,.30),rgba(247,250,253,.95) 220px,#f5f8fc 100%)}
.status{height:34px;padding:8px 18px 0;display:flex;justify-content:space-between;color:#fff;font-size:14px;font-weight:800;text-shadow:0 1px 3px #215278}.status .right{letter-spacing:2px}
.header{height:88px;padding:10px 18px 8px;display:flex;align-items:flex-end;gap:10px}.back{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:#ffffffd9;color:var(--blue);font-size:24px;font-weight:900}.header h1{margin:0 0 2px;font-size:26px;line-height:1.1;letter-spacing:-1px}.header small{display:block;color:#527197;font-weight:700;font-size:11px;margin-top:3px}.brand{margin-left:auto;width:34px;height:39px;object-fit:contain}
.content{height:calc(100% - 192px);overflow:hidden;padding:4px 16px 8px}.scroll{height:100%;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.hero{background:linear-gradient(130deg,#2f99fa,#1663da);border-radius:22px;padding:17px;color:white;box-shadow:0 8px 20px #225ca347;margin-bottom:12px}.hero .eyebrow{font-size:11px;font-weight:800;opacity:.88}.hero strong{display:block;font-size:21px;margin-top:5px}.hero p{font-size:11px;margin:8px 0 0;opacity:.9;line-height:1.55}.hero .scope{margin-top:10px;padding:7px 9px;display:inline-block;background:#ffffff32;border-radius:11px;font-size:11px;font-weight:800}
.card{background:#fffefa;border:1px solid #e1eafa;border-radius:19px;box-shadow:0 5px 15px #17377714;padding:15px;margin-bottom:11px}.title{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:900;margin-bottom:10px}.title .sub{font-size:10px;color:#647d9c;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:13px;border-radius:15px;background:#eaf5ff}.metric.green{background:#eaf8ef}.metric.orange{background:#fff2e8}.metric.purple{background:#f1eeff}.metric small{display:block;color:#617995;font-size:10px;font-weight:800}.metric b{display:block;font-size:25px;color:#2278e5;margin-top:3px}.metric.green b{color:#18aa62}.metric.orange b{color:#ea672f}.metric.purple b{color:#7255dc}.metric em{font-style:normal;font-size:10px;color:#647d9c}
.search,.filter{min-height:37px;border:1px solid #d5e4f7;border-radius:12px;background:#fff;color:#778aa7;padding:10px 12px;font-size:11px;font-weight:700}.search{width:100%;margin-bottom:8px}.filters{display:flex;gap:7px;margin-bottom:12px}.filter{padding:9px 10px;white-space:nowrap}.filter.active{background:#e7f3ff;color:#1672d9;border-color:#a9d3ff}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #edf1f8}.row:first-child{border-top:0}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:#e4f2ff;color:#2187f2;font-size:19px;font-weight:900}.icon.green{background:#e2f8e9;color:#18ac62}.icon.orange{background:#fff0e4;color:#ec762d}.icon.purple{background:#efe9ff;color:#8565e5}.copy{min-width:0;flex:1}.copy b{display:block;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy small{display:block;color:#7186a3;font-size:10px;line-height:1.5;margin-top:3px}.chev{font-size:21px;color:#2a85e9}.pill{display:inline-block;font-size:10px;font-weight:800;padding:5px 8px;border-radius:14px;background:#e7f3ff;color:#1675e4;white-space:nowrap}.pill.good{background:#e6f8ec;color:#16a965}.pill.warn{background:#fff0e6;color:#e67032}.pill.bad{background:#ffebeb;color:#d75454}.twoline{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.note{font-size:11px;line-height:1.6;color:#627997}.warning{padding:10px;border-radius:12px;background:#fff0e7;color:#9b4c20;font-size:10px;font-weight:700;line-height:1.55}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #edf1f8;font-size:11px}.line span{color:#6d83a3}.line b{max-width:58%;text-align:right;line-height:1.45}.list-title{font-size:13px;font-weight:900;margin:14px 2px 9px}.actions{display:flex;gap:8px;margin-top:13px}.button{flex:1;min-height:38px;border:1px solid #b9d8f8;border-radius:12px;background:#fff;color:#1878e3;display:grid;place-items:center;font-size:12px;font-weight:900}.button.primary{border-color:#287ff0;background:linear-gradient(120deg,#39a7ff,#1972e8);color:#fff}.button.danger{border-color:#f3c3c1;color:#d65652}.button.disabled{border-color:#e4e9f0;background:#eff2f5;color:#9aa8b6}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.input{padding:10px;border:1px solid #d8e4f1;border-radius:11px;background:#f7fbff;color:#7186a3;font-size:11px;line-height:1.35}.input.multi{height:58px}.tabs{display:flex;gap:6px;padding:4px;background:#e8f3ff;border-radius:14px;margin-bottom:12px}.tab{flex:1;text-align:center;padding:8px 4px;border-radius:11px;color:#5b79a0;font-size:11px;font-weight:800}.tab.sel{background:#fff;color:#1979ea;box-shadow:0 2px 7px #2b65a428}.check{display:inline-grid;place-items:center;width:19px;height:19px;border:2px solid #6aaef4;border-radius:5px;color:#fff;font-size:13px;line-height:1;background:#2188ef}.check.off{background:#fff;color:transparent;border-color:#b8c7da}.divider{height:1px;background:#e6edf5;margin:9px 0}.footer{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;gap:10px;padding:9px 16px 15px;background:#fffefcef;border-top:1px solid #e2e9f5;backdrop-filter:blur(8px)}.footer .button{height:42px}
.overlay{position:absolute;inset:0;background:#1733629c;display:flex;align-items:center;justify-content:center;padding:22px}.modal{background:#fffefa;border-radius:23px;padding:20px;width:100%;box-shadow:0 20px 50px #0e294866}.modal h2{margin:0 0 9px;font-size:18px}.modal p{font-size:12px;line-height:1.65;color:#607898;margin:0 0 12px}.modal .actions{margin-top:16px}.state-page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;background:linear-gradient(180deg,#d9f1ff,#f8fbff)}.state-symbol{width:72px;height:72px;border-radius:25px;background:#e7f3ff;display:grid;place-items:center;font-size:36px;margin-bottom:20px;color:#2186ec}.state-page h1{font-size:23px;margin:0 0 10px}.state-page p{font-size:13px;line-height:1.7;color:#5f7896;text-align:center}.state-page .button{flex:none;width:100%;margin-top:10px}
</style></head><body><div id="app"></div>
<script>
const page=new URLSearchParams(location.search).get('page')||'A-01';
const img='../../../workspace/miniprogram/assets/g0/brand-logo.png';
const row=(icon,title,meta,pill='',tone='')=>`<div class="row"><div class="icon ${tone}">${icon}</div><div class="copy"><b>${title}</b><small>${meta}</small></div>${pill?`<span class="pill ${tone}">${pill}</span>`:'<span class="chev">›</span>'}</div>`;
const card=(title,body,sub='')=>`<section class="card"><div class="title">${title}<span class="sub">${sub}</span></div>${body}</section>`;
const hero=(title,note,scope='启航实验学校 / 三年级 2 班')=>`<div class="hero"><div class="eyebrow">雅睿英语 / 管理工作区</div><strong>${title}</strong><p>${note}</p><span class="scope">管理范围　${scope}</span></div>`;
const btn=(label,cls='')=>`<div class="button ${cls}">${label}</div>`;
const screens={
'A-01':{title:'管理工作台',sub:'当前教师 / 独立管理授权',body:hero('周老师，管理工作顺利','只显示您逐账号获授权的模块和数据。')+'<div class="filters"><span class="filter active">近 7 天 ▾</span><span class="filter">刷新概览 ↻</span></div>'+card('授权范围概览','<div class="grid2"><div class="metric"><small>学校</small><b>1</b><em>当前可管理</em></div><div class="metric green"><small>班级</small><b>2</b><em>仅已授权范围</em></div><div class="metric orange"><small>账号</small><b>72</b><em>虚构演示数据</em></div><div class="metric purple"><small>任务与活动</small><b>3</b><em>近 7 天</em></div></div>')+card('管理待办',row('▣','待审核媒体','2 条 / 需逐项核对版权、扫描和对位','2','green')+row('!','异常任务','1 条 / 进入记录和审计','1','orange'))+card('管理模块',row('▦','学校与班级','新建、分配、停用')+row('♙','用户管理','账号、绑定、恢复与停用')+row('◈','权限管理','逐账号授权与撤销')+row('▤','教材中心','展示、授权与发布')+row('▦','学校习题库','范围、上下架与批量操作')+row('✓','任务与活动','状态、历史和导出')+row('▶','音视频审核','证据、意见、通过与上架')),foot:btn('返回教师“我的”')},
'A-02':{title:'学校与班级',sub:'组织范围实时核验',body:hero('学校与班级管理','纵向分层查看；操作前显示影响对象。')+'<div class="search">⌕　搜索学校或班级</div><div class="filters"><span class="filter active">启航实验学校 ▾</span><span class="filter">全部状态 ▾</span></div>'+card('启航实验学校',row('▦','三年级 2 班','三年级 / 上学期 / 36 名学员','启用','green')+row('▦','四年级 1 班','四年级 / 上学期 / 32 名学员','启用','green'))+card('班级详情 / 三年级 2 班','<div class="line"><span>负责教师</span><b>林老师</b></div><div class="line"><span>授权范围</span><b>本校、本班</b></div><div class="line"><span>当前学员</span><b>36 人</b></div><div class="warning">停用前须先处理仍在班级中的学员。版本变化时保留输入并提示刷新。</div><div class="actions">'+btn('编辑班级')+btn('分配教师','primary')+'</div>'),foot:btn('新建班级','primary')},
'A-03':{title:'用户管理',sub:'当前组织与班级范围',body:hero('用户与关系','手机号脱敏；作品恢复仅在期限内按记录操作。')+'<div class="search">⌕　搜索姓名或学号</div><div class="filters"><span class="filter active">学生 ▾</span><span class="filter">三年级 2 班 ▾</span><span class="filter">启用 ▾</span></div>'+card('授权账号',row('宇','小宇　STU-DEMO-0032','三年级 2 班 / 138****5678','启用','green')+row('可','小可　STU-DEMO-0033','三年级 2 班 / 139****2468','启用','green'))+card('小宇 / 学生记录','<div class="line"><span>家长绑定</span><b>1 位 / 可查看详情</b></div><div class="line"><span>近 7 天已删草稿</span><b>1 条 / 到期前可恢复</b></div><div class="warning">恢复须具备 student_work.restore 权限，填写原因；不展示录音地址。</div><div class="actions">'+btn('查看关系')+btn('已删草稿','primary')+'</div>'),foot:btn('新建账号','primary')},
'A-04':{title:'权限管理',sub:'逐账号授权 / 不得自我提权',body:hero('管理授权','指定教师分别配置功能与班级范围；变更使旧会话失效。')+'<div class="search">⌕　查找教师账号</div>'+card('林老师 / 教师账号','<div class="line"><span>教学权限</span><b>三年级 2 班</b></div><div class="line"><span>独立管理授权</span><b>待配置</b></div><div class="line"><span>待变更</span><b>3 项，保存前核对</b></div><div class="divider"></div><div class="field"><label>管理功能</label><div class="twoline"><span class="pill">用户管理</span><span class="pill">任务管理</span><span class="pill">审计查看</span></div></div><div class="field"><label>可管理范围</label><div class="input">启航实验学校 / 三年级 2 班　⌄</div></div><div class="warning">只能授予您自身具备的功能和范围；本人账号不可自授。</div>')+card('最近授权记录',row('◷','权限变更记录','操作者、版本、原因和时间均可追溯')),foot:btn('重置')+btn('预览变更并保存','primary')},
'A-05':{title:'教材中心管理',sub:'授权目录 / 版本化发布',body:hero('教材可见范围','配置展示与班级授权；旧任务继续使用原快照。')+'<div class="search">⌕　搜索教材或班级</div><div class="filters"><span class="filter active">全部班级 ▾</span><span class="filter">全部状态 ▾</span></div>'+card('同步学教材',row('▣','虚构同步教材 / 三年级上','可见三年级 2 班 / 版本 v1','已发布','green')+row('▣','虚构同步教材 / 四年级上','草稿 / 待范围核对','草稿','orange'))+card('当前教材详情','<div class="line"><span>可见范围</span><b>三年级 2 班</b></div><div class="line"><span>目录/页图</span><b>Unit 1 / 9 页</b></div><div class="line"><span>最近更新</span><b>2026-10-02</b></div><div class="warning">基础页图“已发布”不代表完成 M3 音频、点读、版权和进度索引审核。</div><div class="actions">'+btn('教师视角预览')+btn('调整范围','primary')+'</div>'),foot:btn('保存草稿')+btn('发布配置','primary')},
'A-06':{title:'学校习题库',sub:'题目正文只读 / 范围与上下架',body:hero('题库管理','先明确选择范围和数量，再批量执行。')+'<div class="search">⌕　搜索题目或知识点</div><div class="filters"><span class="filter active">三年级 ▾</span><span class="filter">全部题型 ▾</span><span class="filter">已上架 ▾</span></div>'+card('当前筛选 / 12 题','<div class="row"><span class="check">✓</span><div class="copy"><b>选择题 / 动物名称</b><small>Unit 3 / 可见三年级 2 班</small></div><span class="pill good">已上架</span></div><div class="row"><span class="check off">✓</span><div class="copy"><b>填空题 / 短句表达</b><small>Unit 3 / 可见三年级 2 班</small></div><span class="pill good">已上架</span></div><div class="note">已选 1 题；“全选”仅作用于当前已加载结果。</div>')+card('题目预览','<div class="line"><span>题干</span><b>Which animal is tall?</b></div><div class="line"><span>答案与解析</span><b>只读展开查看</b></div><div class="line"><span>版本</span><b>v1 / 替换须新版本</b></div>'),foot:btn('设置可见范围')+btn('批量下架','danger')},
'A-07':{title:'任务与活动',sub:'授权班级 / 历史记录保留',body:hero('任务与活动管理','任务状态按当前时间推导；停用需理由和二次确认。')+'<div class="search">⌕　搜索任务或教师</div><div class="filters"><span class="filter active">全部类型 ▾</span><span class="filter">近 30 天 ▾</span><span class="filter">全部状态 ▾</span></div>'+card('任务列表',row('▤','动物主题听说练习','林老师 / 三年级 2 班 / 27/36 已提交','进行中','green')+row('✓','动物阅读七日打卡','三年级 2 班 / 今日 21/36 完成','进行中','green')+row('▤','虚构习题草稿','未发布 / 无学员关系','草稿','orange'))+card('当前任务操作','<div class="line"><span>已完成</span><b>27 / 36</b></div><div class="line"><span>待检查</span><b>6 份</b></div><div class="warning">进行中的活动先关闭再回收；已发布任务仅软回收，历史提交与点评保留。</div><div class="actions">'+btn('查看详情')+btn('导出当前筛选','primary')+'</div>'),foot:btn('刷新列表','primary')},
'A-08':{title:'音视频审核',sub:'审核与上架为两个阶段',body:hero('媒体审核','先核对来源、版权、扫描、转码和逐题对位。')+'<div class="tabs"><span class="tab sel">待审核 2</span><span class="tab">待上架</span><span class="tab">已上架</span></div>'+card('虚构 Unit 3 听力材料','<div class="twoline"><span class="pill">音频 / 3 题</span><span class="pill good">扫描通过</span><span class="pill good">转码完成</span></div><div class="line"><span>创建教师</span><b>林老师</b></div><div class="line"><span>可见范围</span><b>三年级 2 班</b></div><div class="line"><span>版权证明</span><b>已人工核对　›</b></div><div class="line"><span>字幕/文本</span><b>已附　›</b></div><div class="line"><span>逐题音频对位</span><b>3 / 3 可试听　›</b></div><div class="line"><span>媒体版本</span><b>v2 / 已引用 0 次</b></div>')+card('审核意见','<div class="input multi">填写审核意见；驳回时必填。</div><div class="note">通过后先进入“待上架”，不会自动对学生或任务开放。</div><div class="note">查看版本与审计　›</div>'),foot:btn('驳回','danger')+btn('审核通过','primary')},
};
const state={
'no-access':{symbol:'🔒',title:'暂无管理授权',text:'当前教师账号没有独立管理权限。返回“我的”后仍可使用原教学功能。',button:'返回教师“我的”'},
'conflict':{symbol:'↻',title:'记录已更新',text:'其他管理员已修改当前版本。您填写的原因和筛选仍保留，请核对最新内容后重新提交。',button:'刷新并核对'},
'media-reject':{symbol:'!',title:'请填写驳回原因',text:'扫描、转码、版权和逐题对位必须逐项核对。驳回原因为空时不能提交。',button:'返回审核意见'},
'revoke':{symbol:'⚠',title:'确认撤销管理授权？',text:'林老师将立即失去 A-01—A-08 中已授权的管理功能；教学权限保持原样。旧管理会话下一次请求将被拒绝。',button:'确认撤销'},
};
const app=document.getElementById('app');
if(state[page]){const s=state[page];app.innerHTML=`<div class="phone"><div class="state-page"><div class="state-symbol">${s.symbol}</div><h1>${s.title}</h1><p>${s.text}</p><div class="button primary">${s.button}</div></div></div>`}
else{const s=screens[page]||screens['A-01'];app.innerHTML=`<div class="phone"><div class="status"><span>9:41</span><span class="right">▮▮▮　◉　▰</span></div><div class="header"><div class="back">‹</div><div><h1>${s.title}</h1><small>${s.sub}</small></div><img class="brand" src="${img}"></div><div class="content"><div class="scroll">${s.body}</div></div><div class="footer">${s.foot}</div></div>`}
</script></body></html>
